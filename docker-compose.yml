version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: voxy-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: voxy
      MYSQL_USER: voxy_user
      MYSQL_PASSWORD: voxy_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - voxydigital

volumes:
  mysql_data:

networks:
  voxydigital:
    driver: bridge