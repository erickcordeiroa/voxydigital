version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: voxy-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: voxy
      POSTGRES_USER: voxy_user
      POSTGRES_PASSWORD: voxy_password
      POSTGRES_ROOT_PASSWORD: root_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ecolecao

  n8n:
    image: n8nio/n8n:latest
    container_name: voxy-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - ecolecao

volumes:
  postgres_data:
  n8n_data:

networks:
  ecolecao:
    driver: bridge